# Makes hyprsunset do nothing to the screen by default.
# Without this, the default applies some tint to the monitor.
# `toggle nightlight` switches the night light on and off at runtime.
profile {
    time = 07:00
    identity = true
}

# For an automatic night light in the evening, add:
# profile {
#     time = 20:00
#     temperature = 4000
# }
