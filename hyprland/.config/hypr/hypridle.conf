# Idle: dim at 2.5 min, lock at 5 min, screens off at 5.5 min.
# `toggle idle` stops/starts hypridle to turn all of this off and on.

general {
    lock_cmd = pidof hyprlock || hyprlock                                    # one hyprlock at a time
    before_sleep_cmd = loginctl lock-session                                 # lock before suspend
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'  # no double key press to wake the screens
    inhibit_sleep = 3                                                        # wait until the screen is locked
}

# Dim through hyprsunset's gamma: works on external monitors, which have no backlight.
listener {
    timeout = 150                               # 2.5 min
    on-timeout = hyprctl hyprsunset gamma 50
    on-resume = hyprctl hyprsunset gamma 100
}

listener {
    timeout = 300                               # 5 min
    on-timeout = loginctl lock-session
}

listener {
    timeout = 330                               # 5.5 min
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })' && hyprctl hyprsunset gamma 100
}
