# Lock screen. Colours ($bg, $fg, $accent, ...) come from theme-set.
source = ~/.config/theme/generated/colors.conf

general {
    ignore_empty_input = true
}

background {
    monitor =
    color = $bg
    path = screenshot
    blur_passes = 3
}

animations {
    enabled = false
}

input-field {
    monitor =
    size = 650, 100
    position = 0, 0
    halign = center
    valign = center

    inner_color = $bg
    outer_color = $accent
    outline_thickness = 4

    font_family = JetBrainsMono Nerd Font
    font_color = $fg

    placeholder_text = Enter Password
    check_color = $yellow
    fail_color = $red
    fail_text = <i>$FAIL ($ATTEMPTS)</i>

    rounding = 0
    shadow_passes = 0
    fade_on_empty = false
}

auth {
    fingerprint:enabled = false
}
