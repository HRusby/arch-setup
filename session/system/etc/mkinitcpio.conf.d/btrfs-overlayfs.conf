# Sourced by mkinitcpio after mkinitcpio.conf: add limine-mkinitcpio-hook's
# overlayfs hook right after filesystems, so read-only snapper snapshots picked
# in the Limine menu boot with a writable overlay (limine-snapper-sync README).
# A systemd initramfs needs sd-btrfs-overlayfs instead. Safe to source more than once.
# shellcheck shell=bash disable=SC2034
if [[ " ${HOOKS[*]} " != *" btrfs-overlayfs "* && " ${HOOKS[*]} " != *" sd-btrfs-overlayfs "* ]]; then
    _overlay_hook=btrfs-overlayfs
    [[ " ${HOOKS[*]} " == *" systemd "* ]] && _overlay_hook=sd-btrfs-overlayfs
    _overlay_hooks=()
    for _overlay_h in "${HOOKS[@]}"; do
        _overlay_hooks+=("$_overlay_h")
        if [[ $_overlay_h == filesystems ]]; then
            _overlay_hooks+=("$_overlay_hook")
        fi
    done
    HOOKS=("${_overlay_hooks[@]}")
    unset _overlay_hooks _overlay_h _overlay_hook
fi
