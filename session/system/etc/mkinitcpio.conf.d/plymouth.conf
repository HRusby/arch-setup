# Sourced by mkinitcpio after mkinitcpio.conf: add the plymouth hook right after
# udev (or systemd), so it starts early and comes before encrypt/sd-encrypt and
# asks for the LUKS passphrase. Safe to source more than once.
# shellcheck shell=bash disable=SC2034
if [[ " ${HOOKS[*]} " != *" plymouth "* ]]; then
    _plymouth_hooks=()
    for _plymouth_hook in "${HOOKS[@]}"; do
        _plymouth_hooks+=("$_plymouth_hook")
        if [[ $_plymouth_hook == udev || $_plymouth_hook == systemd ]]; then
            _plymouth_hooks+=(plymouth)
        fi
    done
    HOOKS=("${_plymouth_hooks[@]}")
    unset _plymouth_hooks _plymouth_hook
fi
